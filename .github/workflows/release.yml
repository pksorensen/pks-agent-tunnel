name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-push:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Push to GitHub Container Registry by default — uses the built-in
      # GITHUB_TOKEN, no per-repo runner provisioning needed. Image lands at:
      #   ghcr.io/pksorensen/agent-tunnel-server:<version>
      #   ghcr.io/pksorensen/agent-tunnel-server:latest
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional second push to registry.kjeldager.io — only attempted when
      # REGISTRY_KJELDAGER_USERNAME + REGISTRY_KJELDAGER_PASSWORD secrets are set.
      # The whole step set is gated; absence of secrets is not an error.
      - name: Log in to registry.kjeldager.io (optional)
        if: ${{ vars.PUSH_TO_KJELDAGER_REGISTRY == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: registry.kjeldager.io
          username: ${{ secrets.REGISTRY_KJELDAGER_USERNAME }}
          password: ${{ secrets.REGISTRY_KJELDAGER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/agent-tunnel-server/Dockerfile
          push: true
          # Build context = repo root so the Dockerfile can COPY go.work and
          # the sibling src/protocol module the server's go.mod replaces.
          tags: |
            ghcr.io/pksorensen/agent-tunnel-server:${{ needs.release-please.outputs.version }}
            ghcr.io/pksorensen/agent-tunnel-server:latest
            ${{ vars.PUSH_TO_KJELDAGER_REGISTRY == 'true' && format('registry.kjeldager.io/agent-tunnel-server:{0}', needs.release-please.outputs.version) || '' }}
            ${{ vars.PUSH_TO_KJELDAGER_REGISTRY == 'true' && 'registry.kjeldager.io/agent-tunnel-server:latest' || '' }}
