name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-push:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, devcontainer-runner]
    steps:
      - uses: actions/checkout@v4

      # JIT devcontainer runners on this repo come up with the docker CLI and
      # the pks-creds helper, but dockerd itself isn't always running. Start
      # it via the docker-init.sh script that ships with the pks-fullstack-base
      # image (passwordless sudo is pre-configured for that path). Idempotent.
      - name: Ensure docker daemon is running
        run: |
          if docker info >/dev/null 2>&1; then
            echo "docker daemon already running"
          elif [ -x /usr/local/share/docker-init.sh ]; then
            echo "starting dockerd via docker-init.sh"
            sudo /usr/local/share/docker-init.sh &
            for i in $(seq 1 30); do
              if docker info >/dev/null 2>&1; then
                echo "docker daemon up after ${i}s"
                break
              fi
              sleep 1
            done
            docker info >/dev/null 2>&1 || { echo "::error::dockerd did not come up within 30s"; exit 1; }
          else
            echo "::error::No docker daemon and no /usr/local/share/docker-init.sh on this runner"
            exit 1
          fi

      - name: Log in to registry
        uses: pksorensen/pks-cli/.github/actions/registry-login@main
        with:
          registry: registry.kjeldager.io
      - name: Build and push
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          # Build context = repo root so the Dockerfile can COPY go.work and
          # the sibling src/protocol module the server's go.mod replaces.
          docker build \
            -f src/agent-tunnel-server/Dockerfile \
            -t registry.kjeldager.io/agent-tunnel-server:${VERSION} \
            .
          docker tag registry.kjeldager.io/agent-tunnel-server:${VERSION} registry.kjeldager.io/agent-tunnel-server:latest
          docker push registry.kjeldager.io/agent-tunnel-server:${VERSION}
          docker push registry.kjeldager.io/agent-tunnel-server:latest
      - name: Log out
        if: always()
        run: docker logout registry.kjeldager.io
