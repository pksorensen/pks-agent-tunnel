name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-push:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, devcontainer-runner]
    steps:
      - uses: actions/checkout@v4

      # JIT devcontainer runners on this repo come up with the docker CLI and
      # the pks-creds helper, but dockerd itself isn't always running. Start
      # it via the docker-init.sh script that ships with the pks-fullstack-base
      # image (passwordless sudo is pre-configured for that path). Idempotent.
      - name: Ensure docker daemon is running
        run: |
          if docker info >/dev/null 2>&1; then
            echo "docker daemon already running"
          elif [ -x /usr/local/share/docker-init.sh ]; then
            echo "starting dockerd via docker-init.sh"
            sudo /usr/local/share/docker-init.sh &
            for i in $(seq 1 30); do
              if docker info >/dev/null 2>&1; then
                echo "docker daemon up after ${i}s"
                break
              fi
              sleep 1
            done
            docker info >/dev/null 2>&1 || { echo "::error::dockerd did not come up within 30s"; exit 1; }
          else
            echo "::error::No docker daemon and no /usr/local/share/docker-init.sh on this runner"
            exit 1
          fi

      - name: Log in to registry
        uses: pksorensen/pks-cli/.github/actions/registry-login@main
        with:
          registry: registry.kjeldager.io
      - name: Build and push
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          # Build context = repo root so the Dockerfile can COPY go.work and
          # the sibling src/protocol module the server's go.mod replaces.
          docker build \
            -f src/agent-tunnel-server/Dockerfile \
            -t registry.kjeldager.io/agent-tunnel-server:${VERSION} \
            .
          docker tag registry.kjeldager.io/agent-tunnel-server:${VERSION} registry.kjeldager.io/agent-tunnel-server:latest
          docker push registry.kjeldager.io/agent-tunnel-server:${VERSION}
          docker push registry.kjeldager.io/agent-tunnel-server:latest
      - name: Log out
        if: always()
        run: docker logout registry.kjeldager.io

  # Cross-compile the standalone agent-tunnel CLI (Go) for every platform and
  # attach the binaries + checksums to the release, then publish them to the
  # agentics.dk release store so `curl agentics.dk/install/agent-tunnel.sh | bash`
  # serves them without GitHub access. Pure Go cross-compile (CGO disabled) → one
  # ubuntu-latest job builds all targets. The CLI module lives under
  # src/agent-tunnel/ and `replace`s the sibling src/protocol module, so building
  # from that dir with the checked-out repo resolves both.
  build-agent-tunnel-cli:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write    # attach binaries to the GitHub release
      id-token: write     # mint a GitHub OIDC token to publish to agentics.dk (no PAT)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: src/agent-tunnel/go.sum

      - name: Build all platforms
        working-directory: src/agent-tunnel
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}
            name="agent-tunnel_${os}_${arch}"
            [ "$os" = windows ] && name="${name}.exe"
            echo "building $name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${name}" .
          done
          ( cd dist && sha256sum agent-tunnel_* > "agent-tunnel_${VERSION}_checksums.txt" )
          ls -la dist

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            src/agent-tunnel/dist/* \
            --repo "${{ github.repository }}" \
            --clobber

      # Publish the binaries to the agentics.dk release store. Auth is an ephemeral
      # GitHub OIDC token (no PAT); agentics.dk verifies the audience + repo owner
      # and auto-registers the (repo, component) product on first publish.
      - name: Publish to agentics.dk release store
        continue-on-error: true # best-effort until the first release lands
        working-directory: src/agent-tunnel/dist
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          REC="agent-tunnel-${VERSION}"
          OIDC=$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://agentics.dk/releases" | jq -r '.value')
          [ -n "$OIDC" ] && [ "$OIDC" != "null" ] || { echo "::error::failed to mint OIDC token"; exit 1; }
          curl -fsS -X POST -H "Authorization: Bearer ${OIDC}" -H "Content-Type: application/json" \
            -d "{\"component\":\"agent-tunnel\",\"semver\":\"${VERSION}\",\"tagName\":\"${TAG}\"}" \
            https://agentics.dk/api/releases >/dev/null
          for f in agent-tunnel_* *checksums.txt; do
            [ -f "$f" ] || continue
            echo "uploading $f"
            curl -fsS -X PUT -H "Authorization: Bearer ${OIDC}" \
              --data-binary @"$f" \
              "https://agentics.dk/api/releases/${REC}/attachments/$(basename "$f")"
            echo
          done
          curl -fsS -X PUT -H "Authorization: Bearer ${OIDC}" \
            "https://agentics.dk/api/releases/${REC}/publish" >/dev/null
          echo "published ${REC}"

      # Publish the /tools/agent-tunnel documentation. The doc source of truth
      # lives in THIS repo under .agentics/tool/ and ships on the same release cut
      # as the binary, so the public docs can never drift behind the CLI. Same
      # trusted-publishing model: an ephemeral OIDC token with audience
      # https://agentics.dk/docs, gated by the same (repo, component) product.
      - name: Publish tool docs to agentics.dk
        continue-on-error: true # best-effort until the docs route is deployed
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          DOCS_DIR: .agentics/tool
        run: |
          set -euo pipefail
          [ -d "$DOCS_DIR" ] || { echo "no $DOCS_DIR dir, skipping docs publish"; exit 0; }
          OIDC=$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://agentics.dk/docs" | jq -r '.value')
          [ -n "$OIDC" ] && [ "$OIDC" != "null" ] || { echo "::error::failed to mint docs OIDC token"; exit 1; }
          FILES="[]"
          while IFS= read -r -d '' f; do
            REL="${f#"$DOCS_DIR"/}"
            FILES=$(jq --arg p "$REL" --rawfile c "$f" '. + [{path:$p, content:$c}]' <<<"$FILES")
          done < <(find "$DOCS_DIR" -name '*.md' -print0)
          COUNT=$(jq 'length' <<<"$FILES")
          [ "$COUNT" -gt 0 ] || { echo "no .md docs found, skipping"; exit 0; }
          PAYLOAD=$(jq -n --arg component agent-tunnel --arg version "$VERSION" --argjson files "$FILES" \
            '{component:$component, version:$version, files:$files}')
          curl -fsS -X POST -H "Authorization: Bearer ${OIDC}" -H "Content-Type: application/json" \
            -d "$PAYLOAD" https://agentics.dk/api/tools/docs
          echo "published agent-tunnel docs v${VERSION} (${COUNT} files)"
