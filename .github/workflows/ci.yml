name: CI

on:
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            src/agent-tunnel/go.sum
            src/agent-tunnel-server/go.sum
      - name: Vet
        run: go vet ./src/agent-tunnel/... ./src/agent-tunnel-server/... ./src/protocol/...
      - name: Build
        run: go build ./src/agent-tunnel/... ./src/agent-tunnel-server/... ./src/protocol/...
      - name: Test
        run: go test ./src/agent-tunnel/... ./src/agent-tunnel-server/... ./src/protocol/...

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'
      - name: Restore
        run: dotnet restore src/aspire/Aspire.Hosting.AgentTunnel/
      - name: Build
        run: dotnet build src/aspire/Aspire.Hosting.AgentTunnel/ --no-restore
